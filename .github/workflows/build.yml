name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 11
        uses: actions/setup-java@v4.7.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.1

      - name: Install NDK 21.0.6113669
        run: |
          echo "y" | sdkmanager --install "ndk;21.0.6113669"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.0.6113669" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.0.6113669" >> $GITHUB_ENV

      - name: Install Build Tools & Platform
        run: |
          echo "y" | sdkmanager --install "build-tools;29.0.2" "platforms;android-29"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LQM-Loader-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload .so file
        uses: actions/upload-artifact@v4
        with:
          name: libtgpa-so
          path: app/build/intermediates/ndkBuild/release/obj/local/arm64-v8a/libtgpa.so
          if-no-files-found: warn
