name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools

          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest

          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager

          yes | $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true

          $SDKMANAGER --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-29" \
            "build-tools;29.0.2" \
            "ndk;21.0.6113669"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.0.6113669" >> $GITHUB_ENV

      - name: Upgrade Gradle wrapper to 7.6.4
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6.4-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LQM-Loader-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload .so file
        uses: actions/upload-artifact@v6
        with:
          name: libtgpa-so
          path: app/build/intermediates/ndkBuild/release/obj/local/arm64-v8a/libtgpa.so
          if-no-files-found: warn
