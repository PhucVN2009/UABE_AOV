name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        run: |
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          mkdir -p $HOME/android-sdk/cmdline-tools
          curl -fsSL $CMDLINE_TOOLS_URL -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

          yes | sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses > /dev/null 2>&1 || true

          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platforms;android-29" \
            "build-tools;29.0.2" \
            "ndk;21.0.6113669"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.0.6113669" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: LQM-Loader-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload .so file
        uses: actions/upload-artifact@v6
        with:
          name: libtgpa-so
          path: app/build/intermediates/ndkBuild/release/obj/local/arm64-v8a/libtgpa.so
          if-no-files-found: warn
